services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: million_checkbox_app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      # We use the service names 'postgres' and 'valkey' as hostnames
      DATABASE_URL: postgres://admin:admin@postgres:5432/million_checkbox_db
      REDIS_HOST: valkey
    depends_on:
      - postgres
      - valkey
    networks:
      - internal_net # Connects to DBs
      - app_network # Connects to external OIDC provider
    command: tail -f /dev/null

  postgres:
    image: postgres:17
    container_name: million_checkbox_db
    restart: unless-stopped
    # Ports only exposed for local debugging, app uses internal port 5432
    ports:
      - "5445:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: million_checkbox_db
    volumes:
      - pgdatamillioncheckboxdb:/var/lib/postgresql/data
    networks:
      - internal_net

  valkey:
    image: valkey/valkey:latest
    container_name: million_checkbox_valkey
    networks:
      - internal_net

networks:
  # This is the private bridge for your app services
  internal_net:
    driver: bridge
  
  # This references your existing external network
  app_network:
    name: oidc-auth-ts_app_network
    external: true

volumes:
  pgdatamillioncheckboxdb: