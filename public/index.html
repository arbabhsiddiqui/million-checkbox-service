<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 million checkboxes</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #020118;
        color: aliceblue;
    }

    #container {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
    }
</style>

<body>
    <h1>1 Million Checkboxes</h1>
    <div id="container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('container');


        socket.on('server:checkbox-change', (data) => {
            console.log("socket server event", data)

            const { index, checked } = data;

            const input = document.getElementById(`checkbox-${index}`);
            if (input) {
                input.checked = checked;
            }

        })

        window.addEventListener("load", async () => {
            // Fetch initial state from the server
            const res = await fetch('/checkboxes')
            const data = await res.json()

            if (data && data.checkboxes) {
                data.checkboxes.forEach((serverValue, index) => {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = `checkbox-${index}`;
                    checkbox.checked = serverValue;


                    checkbox.addEventListener('change', (e) => {

                        const checked = e.target.checked;
                        console.log({ index, checked })

                        socket.emit('client:checkbox-change', { index, checked })




                    });

                    container.appendChild(checkbox);
                });
            }

        });



    </script>
</body>

</html>
